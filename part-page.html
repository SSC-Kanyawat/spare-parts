<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#00AEEF">
<title>เบิกอะไหล่</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --blue:    #00AEEF;
    --green:   #8DC63F;
    --blue-dk: #0090C8;
    --green-dk:#72A832;
    --bg:      #F4F7FA;
    --surface: #FFFFFF;
    --border:  #DDE4EC;
    --text:    #1A2B3C;
    --text2:   #4A6070;
    --text3:   #8FA3B1;
    --success: #8DC63F;
    --danger:  #E53935;
    --warning: #F59E0B;
    --radius:  14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, var(--blue) 0%, #00C4FF 100%);
    padding: 0 20px;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 12px rgba(0,174,239,0.25);
  }
  .header-inner { display: flex; align-items: center; gap: 12px; padding: 14px 0; }
  .header-logo {
    width: 42px; height: 42px; background: white; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .header-title { font-size: 17px; font-weight: 700; color: white; line-height: 1.2; }
  .header-sub   { font-size: 11px; color: rgba(255,255,255,0.82); margin-top: 2px; font-family: 'IBM Plex Mono', monospace; }

  .company-strip {
    background: var(--green);
    text-align: center; padding: 5px 20px;
    font-size: 12px; font-weight: 600; color: white; letter-spacing: 0.4px;
  }

  /* CONTENT */
  .content { padding: 18px 16px 120px; }

  /* STOCK CARD */
  .stock-card {
    background: var(--surface); border-radius: var(--radius);
    padding: 22px 20px 18px; margin-bottom: 14px; text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 1px solid var(--border);
    position: relative; overflow: hidden;
  }
  .stock-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--blue), var(--green));
  }
  .stock-label { font-size: 12px; color: var(--text3); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.8px; }
  .stock-num { font-family: 'IBM Plex Mono', monospace; font-size: 68px; font-weight: 600; line-height: 1; color: var(--blue); }
  .stock-num.low   { color: var(--warning); }
  .stock-num.empty { color: var(--danger); }
  .stock-unit { font-size: 18px; color: var(--text2); margin-top: 6px; }

  .minmax-bar {
    display: flex; justify-content: center; align-items: stretch;
    gap: 16px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border);
  }
  .minmax-item { text-align: center; flex: 1; }
  .minmax-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
  .minmax-val { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 700; margin-top: 4px; }
  .minmax-val.min-val { color: var(--danger); }
  .minmax-val.max-val { color: var(--green-dk); }
  .minmax-divider { width: 1px; background: var(--border); align-self: stretch; flex-shrink: 0; }

  .stock-warn {
    margin-top: 10px; font-size: 12px; padding: 5px 14px;
    border-radius: 20px; display: inline-block; font-weight: 500;
  }
  .stock-warn.low   { background: rgba(245,158,11,0.12); color: var(--warning); }
  .stock-warn.empty { background: rgba(229,57,53,0.10);  color: var(--danger); }

  /* INFO */
  .info-row {
    display: flex; gap: 10px; margin-bottom: 14px;
  }
  .info-card {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .info-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .info-value { font-size: 14px; font-weight: 600; color: var(--text); }

  /* FORM */
  .form-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.04);
  }
  .form-title {
    font-size: 12px; font-weight: 700; color: var(--blue);
    margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.8px;
    display: flex; align-items: center; gap: 6px;
  }
  .form-title::before {
    content: ''; display: inline-block; width: 3px; height: 14px; border-radius: 2px;
    background: linear-gradient(180deg, var(--blue), var(--green));
  }
  .form-group { margin-bottom: 14px; }
  .form-group:last-child { margin-bottom: 0; }
  .form-label { font-size: 13px; color: var(--text2); margin-bottom: 6px; display: block; font-weight: 500; }
  .form-input {
    width: 100%; background: var(--bg); border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px;
    color: var(--text); font-family: 'Sarabun', sans-serif; font-size: 15px; outline: none;
    transition: border-color 0.15s;
  }
  .form-input:focus { border-color: var(--blue); background: white; }
  .form-input::placeholder { color: var(--text3); }
  .form-input:disabled { opacity: 0.4; background: #eee; }

  .qty-control { display: flex; align-items: center; gap: 10px; }
  .qty-btn {
    width: 46px; height: 46px; border-radius: 50%;
    border: 2px solid var(--blue); background: white; color: var(--blue);
    font-size: 24px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; user-select: none; font-weight: 700; transition: all 0.12s;
  }
  .qty-btn:active { background: var(--blue); color: white; transform: scale(0.90); }
  .qty-input {
    flex: 1; text-align: center; font-family: 'IBM Plex Mono', monospace;
    font-size: 28px; font-weight: 600; background: var(--bg);
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    padding: 8px; color: var(--text); outline: none;
  }
  .qty-input:focus { border-color: var(--blue); background: white; }
  .qty-input:disabled { opacity: 0.4; }

  /* BOTTOM */
  .bottom-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px; padding: 12px 16px 16px;
    background: white; border-top: 1px solid var(--border);
    box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
  }
  .btn-submit {
    width: 100%;
    background: linear-gradient(135deg, var(--blue) 0%, var(--green) 100%);
    color: white; border: none; border-radius: 12px; padding: 16px;
    font-family: 'Sarabun', sans-serif; font-size: 17px; font-weight: 700;
    cursor: pointer; box-shadow: 0 4px 14px rgba(0,174,239,0.35);
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-submit:active { transform: scale(0.98); opacity: 0.9; }
  .btn-submit:disabled { background: var(--border); color: var(--text3); box-shadow: none; cursor: default; transform: none; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    z-index: 50; display: none; align-items: flex-end; padding: 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box { background: white; border-radius: 20px; width: 100%; padding: 24px; box-shadow: 0 -4px 30px rgba(0,0,0,0.15); }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; color: var(--text); }
  .modal-body { font-size: 14px; color: var(--text2); line-height: 2; margin-bottom: 22px; }
  .modal-highlight { color: var(--blue); font-weight: 700; }
  .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-cancel {
    padding: 14px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--bg); color: var(--text2);
    font-family: 'Sarabun', sans-serif; font-size: 15px; cursor: pointer; font-weight: 600;
  }
  .btn-confirm {
    padding: 14px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--blue), var(--green)); color: white;
    font-family: 'Sarabun', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;
  }

  /* TOAST */
  .toast {
    position: fixed; bottom: 90px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--green); color: white;
    padding: 13px 22px; border-radius: 40px; font-size: 14px; font-weight: 600;
    z-index: 100; opacity: 0; transition: all 0.25s;
    white-space: nowrap; max-width: 90%; pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); }

  /* LOADING / ERROR */
  .loading-wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 100px 20px; gap: 16px; color: var(--text3); font-size: 14px;
  }
  .spinner {
    width: 42px; height: 42px; border: 3px solid var(--border);
    border-top-color: var(--blue); border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-wrap { text-align: center; padding: 80px 20px; }
  .error-icon { font-size: 48px; margin-bottom: 14px; }
  .error-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .error-sub { font-size: 14px; color: var(--text2); line-height: 1.7; white-space: pre-line; }

  /* SUCCESS */
  .success-wrap {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 40px 24px; text-align: center; gap: 14px; background: var(--bg);
  }
  .success-wrap.show { display: flex; }
  .success-circle {
    width: 90px; height: 90px; border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--green));
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; color: white; box-shadow: 0 6px 24px rgba(0,174,239,0.35);
  }
  .success-title { font-size: 26px; font-weight: 700; color: var(--text); }
  .success-sub { font-size: 15px; color: var(--text2); line-height: 1.8; }
  .success-remaining {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--text3);
    background: white; border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 20px; margin-top: 4px;
  }
  .btn-reload {
    margin-top: 10px; padding: 13px 36px; border-radius: 12px;
    border: 2px solid var(--blue); background: white; color: var(--blue);
    font-family: 'Sarabun', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .btn-reload:active { background: var(--blue); color: white; }
</style>
</head>
<body>

<div class="loading-wrap" id="loadingState">
  <div class="spinner"></div>
  <span>กำลังโหลดข้อมูลอะไหล่...</span>
</div>

<div class="error-wrap" id="errorState" style="display:none">
  <div class="error-icon">⚠️</div>
  <div class="error-title" id="errorTitle">ไม่พบอะไหล่</div>
  <div class="error-sub" id="errorSub">–</div>
</div>

<div id="mainPage" style="display:none">
  <div class="header">
    <div class="header-inner">
      <div class="header-logo" id="hdrIcon">⚙️</div>
      <div>
        <div class="header-title" id="hdrName">–</div>
        <div class="header-sub" id="hdrId">–</div>
      </div>
    </div>
  </div>
  <div class="company-strip">บริษัท เสริมสุข จำกัด (มหาชน) · ระบบเบิกอะไหล่</div>

  <div class="content">

    <div class="stock-card">
      <div class="stock-label">จำนวนคงเหลือ</div>
      <div class="stock-num" id="stockNum">–</div>
      <div class="stock-unit" id="stockUnit">–</div>
      <div class="minmax-bar">
        <div class="minmax-item">
          <div class="minmax-label">ขั้นต่ำ (Min)</div>
          <div class="minmax-val min-val" id="stockMin">–</div>
        </div>
        <div class="minmax-divider"></div>
        <div class="minmax-item">
          <div class="minmax-label">สูงสุด (Max)</div>
          <div class="minmax-val max-val" id="stockMax">–</div>
        </div>
      </div>
      <div class="stock-warn" id="stockWarn" style="display:none"></div>
    </div>

    <div class="info-row">
      <div class="info-card">
        <div class="info-label">หน่วย</div>
        <div class="info-value" id="infoUnit">–</div>
      </div>
      <div class="info-card" id="noteCard" style="display:none">
        <div class="info-label">หมายเหตุ</div>
        <div class="info-value" id="infoNote">–</div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-title">ข้อมูลการเบิก</div>
      <div class="form-group">
        <label class="form-label">จำนวนที่ต้องการเบิก</label>
        <div class="qty-control">
          <div class="qty-btn" onclick="adjustQty(-1)">−</div>
          <input class="qty-input" type="number" id="withdrawQty" value="1" min="1">
          <div class="qty-btn" onclick="adjustQty(+1)">+</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">ชื่อผู้เบิก <span style="color:var(--danger)">*</span></label>
        <input class="form-input" type="text" id="requester" placeholder="ชื่อ-นามสกุล หรือรหัสพนักงาน">
      </div>
      <div class="form-group">
        <label class="form-label">เหตุผล / งานที่ใช้</label>
        <input class="form-input" type="text" id="reason" placeholder="เช่น PM, เปลี่ยนชิ้นส่วนชำรุด">
      </div>
    </div>

  </div>

  <div class="bottom-bar">
    <button class="btn-submit" id="btnSubmit" onclick="confirmWithdraw()">ยืนยันการเบิก</button>
  </div>
</div>

<div class="success-wrap" id="successWrap">
  <div class="success-circle">✓</div>
  <div class="success-title">เบิกสำเร็จ!</div>
  <div class="success-sub" id="successSub">–</div>
  <div class="success-remaining" id="successRemaining">–</div>
  <button class="btn-reload" onclick="location.reload()">เบิกอีกครั้ง</button>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-title">✅ ยืนยันการเบิก</div>
    <div class="modal-body" id="modalBody">–</div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-confirm" onclick="doWithdraw()">ยืนยัน</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwM5c1aADn8utYSfI2JRqHpjvh6YWy-acY6IyW9eaTc2P4wVPyx9Xj6BdgLNeKogePa/exec';
let partData = null;

function getIcon(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('สาย') || n.includes('belt'))                          return '〰️';
  if (n.includes('ลูกปืน') || n.includes('bearing'))                    return '⚙️';
  if (n.includes('น้ำมัน') || n.includes('oil'))                        return '🛢️';
  if (n.includes('ซีล') || n.includes('seal'))                          return '🔴';
  if (n.includes('สกรู') || n.includes('screw') || n.includes('น็อต')) return '🔩';
  if (n.includes('ปั๊ม') || n.includes('pump'))                         return '💧';
  if (n.includes('มอเตอร์') || n.includes('motor'))                     return '⚡';
  if (n.includes('ฟิลเตอร์') || n.includes('filter'))                  return '🔲';
  if (n.includes('วาล์ว') || n.includes('valve'))                       return '🎛️';
  if (n.includes('เซ็นเซอร์') || n.includes('sensor'))                 return '📡';
  return '⚙️';
}

function showError(title, sub) {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('errorState').style.display = 'block';
  document.getElementById('errorTitle').textContent = title;
  document.getElementById('errorSub').textContent   = sub;
}

async function loadPart() {
  const params = new URLSearchParams(window.location.search);
  const partId = params.get('id');
  if (!partId) { showError('ไม่ได้ระบุรหัสอะไหล่', 'URL ต้องมี ?id=รหัสอะไหล่\nเช่น page.html?id=P001'); return; }
  try {
    const res  = await fetch(`${SCRIPT_URL}?action=getPart&id=${encodeURIComponent(partId)}&t=${Date.now()}`);
    const data = await res.json();
    if (!data.success) { showError('ไม่พบอะไหล่', `ไม่พบรหัส "${partId}" ในระบบ`); return; }
    partData = data.part;
    renderPart(partData);
  } catch (err) {
    showError('เชื่อมต่อไม่สำเร็จ', 'ไม่สามารถดึงข้อมูลจาก Google Sheet ได้');
  }
}

function renderPart(p) {
  document.title = `เบิก: ${p.name}`;
  document.getElementById('hdrIcon').textContent = getIcon(p.name);
  document.getElementById('hdrName').textContent = p.name;
  document.getElementById('hdrId').textContent   = p.id;

  const stockEl = document.getElementById('stockNum');
  stockEl.textContent = p.qty;
  if      (p.qty === 0)              stockEl.className = 'stock-num empty';
  else if (p.min != null && p.qty <= p.min) stockEl.className = 'stock-num low';
  else                               stockEl.className = 'stock-num';

  document.getElementById('stockUnit').textContent = p.unit;
  document.getElementById('stockMin').textContent  = p.min != null ? p.min : '–';
  document.getElementById('stockMax').textContent  = p.max != null ? p.max : '–';

  const warnEl = document.getElementById('stockWarn');
  if (p.qty === 0) {
    warnEl.textContent = '🚫 หมดสต็อก — ไม่สามารถเบิกได้';
    warnEl.className = 'stock-warn empty'; warnEl.style.display = 'inline-block';
  } else if (p.min != null && p.qty <= p.min) {
    warnEl.textContent = '⚠️ จำนวนต่ำกว่าขั้นต่ำ — กรุณาสั่งซื้อเพิ่ม';
    warnEl.className = 'stock-warn low'; warnEl.style.display = 'inline-block';
  } else { warnEl.style.display = 'none'; }

  document.getElementById('infoUnit').textContent = p.unit;
  if (p.note) {
    document.getElementById('noteCard').style.display = 'flex';
    document.getElementById('infoNote').textContent   = p.note;
  }

  const disabled = p.qty === 0;
  document.getElementById('withdrawQty').max      = p.qty;
  document.getElementById('withdrawQty').disabled = disabled;
  document.getElementById('requester').disabled   = disabled;
  document.getElementById('reason').disabled      = disabled;
  const btn = document.getElementById('btnSubmit');
  btn.disabled    = disabled;
  btn.textContent = disabled ? 'หมดสต็อก — ไม่สามารถเบิกได้' : 'ยืนยันการเบิก';

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('mainPage').style.display     = 'block';
}

function adjustQty(delta) {
  const input = document.getElementById('withdrawQty');
  let v = parseInt(input.value) || 1;
  input.value = Math.max(1, Math.min(partData.qty, v + delta));
}

function confirmWithdraw() {
  const qty       = parseInt(document.getElementById('withdrawQty').value);
  const requester = document.getElementById('requester').value.trim();
  const reason    = document.getElementById('reason').value.trim();
  if (!qty || qty < 1)   { showToast('กรุณาระบุจำนวน', true); return; }
  if (!requester)         { showToast('กรุณาระบุชื่อผู้เบิก', true); return; }
  if (qty > partData.qty) { showToast(`จำนวนเกิน: มีเพียง ${partData.qty} ${partData.unit}`, true); return; }

  const after   = partData.qty - qty;
  const warnMsg = partData.min != null && after <= partData.min
    ? `<br><span style="color:var(--warning);font-size:12px;">⚠️ หลังเบิกจะต่ำกว่าขั้นต่ำ (${partData.min})</span>` : '';

  document.getElementById('modalBody').innerHTML =
    `<strong>${partData.name}</strong><br>
     จำนวน: <span class="modal-highlight">${qty} ${partData.unit}</span><br>
     ผู้เบิก: <span class="modal-highlight">${requester}</span><br>
     ${reason ? `งาน: ${reason}<br>` : ''}
     <br>คงเหลือหลังเบิก: <strong>${after} ${partData.unit}</strong>${warnMsg}`;
  document.getElementById('modal').classList.add('show');
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

async function doWithdraw() {
  closeModal();
  const qty       = parseInt(document.getElementById('withdrawQty').value);
  const requester = document.getElementById('requester').value.trim();
  const reason    = document.getElementById('reason').value.trim();
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try {
    const url = `${SCRIPT_URL}?action=withdraw`
      + `&id=${encodeURIComponent(partData.id)}&qty=${qty}`
      + `&requester=${encodeURIComponent(requester)}&reason=${encodeURIComponent(reason)}`;
    const res  = await fetch(url);
    const data = await res.json();
    if (data.success) {
      document.getElementById('mainPage').style.display = 'none';
      document.getElementById('successSub').innerHTML =
        `เบิก <strong>${partData.name}</strong><br>จำนวน ${qty} ${partData.unit}<br>โดย: ${requester}`;
      document.getElementById('successRemaining').textContent =
        `คงเหลือในสต็อก: ${data.remaining} ${data.unit}`;
      document.getElementById('successWrap').classList.add('show');
    } else { throw new Error(data.message); }
  } catch (err) {
    showToast(err.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่', true);
    btn.disabled = false; btn.textContent = 'ยืนยันการเบิก';
  }
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

loadPart();
</script>
</body>
</html>
